<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>haddadco for parts</title>
    <meta name="description" content="haddadco for parts — quality parts and exceptional service." />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container" role="main">
      <h1>haddadco for parts</h1>
      <p class="subtitle">Coming soon — quality parts, reliable service.</p>

      <div class="control-group">
        <label for="date-picker" id="date-label">Select a date</label>
        <input type="date" id="date-picker" name="date" aria-labelledby="date-label" />
      </div>

      <button id="contact-btn" class="btn" type="button" aria-label="Contact us by email">Contact us</button>
      <p id="contact-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script>
      (function () {
        var btn = document.getElementById('contact-btn');
        var statusEl = document.getElementById('contact-status');
        if (!btn || !statusEl) return;

        btn.addEventListener('click', function () {
          var confirmMsg = 'you will contact our email';
          if (window.confirm(confirmMsg)) {
            // Update status before navigating
            statusEl.textContent = 'we get your response success';
            statusEl.classList.add('visible');
            // Defer navigation briefly to allow status to render
            setTimeout(function () {
              window.location.href = 'mailto:ashrafhd80@gmail.com';
            }, 100);
          }
        });
      })();

      // Set today's date (local timezone) as the default value for the date picker
      (function () {
        var dateInput = document.getElementById('date-picker');
        if (!dateInput) return;
        var today = new Date();
        var y = today.getFullYear();
        var m = String(today.getMonth() + 1).padStart(2, '0');
        var d = String(today.getDate()).padStart(2, '0');
        dateInput.value = [y, m, d].join('-');
      })();
    </script>
  </body>
</html>
